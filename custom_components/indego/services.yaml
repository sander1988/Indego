command:
  description: Sends a control command to the mower. Valid commands are "mow" (start mowing), "returnToDock" (return to charging station) and "pause" (pause mowing).
  fields:
    mower_serial:
      name: Serialnumber
      description: Serial number of the mower. Only required if multiple mowers are configured.
      example: '"012345789"'
      required: false
      selector:
        text: {}
    mower_entity:
      name: Entity
      description: Select the mower entity. Only required if multiple mowers are configured.
      required: false
      selector:
        entity:
          domain: lawn_mower
          integration: indego
    command:
      name: Command
      description: Command to send to the mower.
      required: true
      selector:
        select:
          translation_key: command_options
          options:
            - "mow"
            - "returnToDock"
            - "pause"

smartmowing:
  description: Enables or disables the SmartMowing feature, which automatically adjusts the mowing schedule based on weather conditions and lawn growth.
  fields:
    mower_serial:
      name: Serialnumber
      description: Serial number of the mower. Only required if multiple mowers are configured.
      example: '"012345789"'
      required: false
      selector:
        text: {}
    mower_entity:
      name: Entity
      description: Select the mower entity. Only required if multiple mowers are configured.
      required: false
      selector:
        entity:
          domain: lawn_mower
          integration: indego
    enable:
      name: Activate/Deactivate
      description: Sets the SmartMowing state. Use "true" to enable or "false" to disable the feature.
      example: "true"
      required: true
      selector:
        boolean: {}

delete_alert:
  description: Deletes a specific alert by its index. Index 0 refers to the most recent alert.
  fields:
    mower_serial:
      name: Serialnumber
      description: Serial number of the mower. Only required if multiple mowers are configured.
      example: '"0123456789"'
      required: false
      selector:
        text: {}
    mower_entity:
      name: Entity
      description: Select the mower entity. Only required if multiple mowers are configured.
      required: false
      selector:
        entity:
          domain: lawn_mower
          integration: indego
    alert_index:
      name: Alert index
      description: Index of the alert to delete. 0 = most recent, 1 = second most recent, and so on.
      example: 0
      required: true
      selector:
        number:
          min: 0
          step: 1
          mode: box

delete_alert_all:
  description: Deletes all existing alerts for the mower at once.
  fields:
    mower_serial:
      name: Serialnumber
      description: Serial number of the mower. Only required if multiple mowers are configured.
      example: '"0123456789"'
      required: false
      selector:
        text: {}
    mower_entity:
      name: Entity
      description: Select the mower entity. Only required if multiple mowers are configured.
      required: false
      selector:
        entity:
          domain: lawn_mower
          integration: indego

read_alert:
  description: Marks a specific alert as read by its index. Index 0 refers to the most recent alert.
  fields:
    mower_serial:
      name: Serialnumber
