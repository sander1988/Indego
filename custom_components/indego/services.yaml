download_map:
  description: Downloads the current mowing map from the Bosch Cloud API and saves it locally as "www/indego_map_base.svg". The map reflects the most recently recorded mowing route.
  fields:
    mower_serial:
      name: Serialnumber
      description: Serial number of the mower. Only required if multiple mowers are configured.
      example: '"0123456789"'
      required: false
      selector:
        text: {}
    mower_entity:
      name: Entity
      description: Select the mower entity. Only required if multiple mowers are configured.
      required: false
      selector:
        entity:
          domain: lawn_mower
          integration: indego

set_calendar_slot:
  description: Set a calendar slot when you use a manual schedule instead of SmartMowing.
  fields:
    mower_serial:
      name: Serialnumber
      description: Serial number of the mower. Only required if multiple mowers are configured.
      example: '"0123456789"'
      required: false
      selector:
        text: {}
    mower_entity:
      name: Entity
      description: Select the mower entity. Only required if multiple mowers are configured.
      required: false
      selector:
        entity:
          domain: lawn_mower
          integration: indego
    days:
      name: Days
      description: Which days to configure.
      example: "monday"
      required: true
      selector:
        select:
          multiple: true
          translation_key: day_options
          options:
            - "monday"
            - "tuesday"
            - "wednesday"
            - "thursday"
            - "friday"
            - "saturday"
            - "sunday"
    slot:
      name: Slot
      description: Which slot of the selected day should be configured (1 or 2).
      example: 1
      required: true
      selector:
        number:
          min: 1
          max: 2
          step: 1
          mode: box
    enabled:
      name: Activate/Deactivate
      description: Should the selected slot be enabled or disabled.
      example: true
      required: false
      selector:
        boolean: {}
    start:
      name: Start time
      description: Set the start time of the selected slot and day. Only needed if you want to enable a slot. Only hour and minute will be used.
      example: "08:00"
      required: false
      selector:
        time: {}
    end:
      name: End time
      description: Set the end time of the selected slot and day. Only needed if you want to enable a slot. Only hour and minute will be used.
      example: "20:00"
      required: false
      selector:
        time: {}

set_predictive_mowing_window:
  description: Set the allowed mowing window for SmartMowing.
  fields:
    mower_serial:
      name: Serial number
      description: Serial number of the mower. Only required if multiple mowers are configured.
      example: "0123456789"
      required: false
      selector:
        text: {}
    mower_entity:
      name: Entity
      description: Select the mower entity. Only required if multiple mowers are configured.
      required: false
      selector:
        entity:
          domain: lawn_mower
          integration: indego
    earliest_start:
      name: Earliest start
      description: Earliest time SmartMowing is allowed to mow. Only hours and minutes are used.
      example: "08:00"
      required: true
      selector:
        time: {}
    latest_end:
      name: Latest end
      description: Latest time SmartMowing is allowed to mow. Only hours and minutes are used.
      example: "20:00"
      required: true
      selector:
        time: {}

set_bump_sensitivity:
  name: Bump sensitivity
  description: Set the mower bump sensitivity.
  fields:
    mower_serial:
      name: Serial number
      description: Serial number of the mower. Only required if multiple mowers are configured.
      required: false
      selector:
        text: {}
    mower_entity:
      name: Entity
      description: Select the mower entity. Only required if multiple mowers are configured.
      required: false
      selector:
        entity:
          domain: lawn_mower
          integration: indego
    bump_sensitivity:
      name: Bump sensitivity
      description: Bump sensitivity of the mower.
      required: true
      selector:
        select:
          translation_key: bump_sensitivity_options
          options:
            - "normal"
            - "slippery"
            - "uneven"

